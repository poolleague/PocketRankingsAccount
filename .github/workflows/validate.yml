name: Validate Account

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore PocketRankingsAccount.slnx
      - run: dotnet build PocketRankingsAccount.slnx -c Release --no-restore
      - run: dotnet test PocketRankingsAccount.slnx -c Release --no-build --no-restore
      - run: dotnet list PocketRankingsAccount.slnx package --vulnerable --include-transitive
      - run: docker compose --env-file .env.example config --quiet
